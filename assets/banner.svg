<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Aarv</title>
  <desc id="d">Developer tools and AI automation. Currently building Attentry.</desc>

  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a2b24"/>
      <stop offset="45%"  stop-color="#09201b"/>
      <stop offset="100%" stop-color="#040d0b"/>
    </linearGradient>

    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffdf9e"/>
      <stop offset="55%"  stop-color="#e9a93c"/>
      <stop offset="100%" stop-color="#8c5d17"/>
    </linearGradient>

    <radialGradient id="vig" cx="50%" cy="45%" r="78%">
      <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#bdf5e4" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#bdf5e4" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#bdf5e4" stop-opacity="0"/>
    </linearGradient>

    <pattern id="mesh" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="none"/>
      <path d="M0 0 H14 M0 0 V14" stroke="#06140f" stroke-opacity="0.55" stroke-width="3"/>
    </pattern>

    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0.16"/>
    </pattern>

    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <clipPath id="frame"><rect width="1200" height="300" rx="10"/></clipPath>

    <style>
      .fade   { animation: fade .9s ease-out both; }
      .d1 { animation-delay: .10s } .d2 { animation-delay: .32s } .d3 { animation-delay: .54s }
      .sweep  { animation: sweep 9s linear infinite; }
      .pulse  { animation: pulse 6s ease-in-out infinite; }
      .pulse2 { animation: pulse 6s ease-in-out infinite; animation-delay: -2.4s; }
      .cursor { animation: blink 1.15s steps(1) infinite; }
      .rule   { animation: rule 9s ease-in-out infinite; transform-origin: 0 0; }
      @keyframes fade  { from { opacity: 0 } to { opacity: 1 } }
      @keyframes sweep { 0% { transform: translateY(-120px) } 100% { transform: translateY(320px) } }
      @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: .95 } }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      @keyframes rule  { 0%,100% { transform: scaleX(.55) } 50% { transform: scaleX(1) } }
      @media (prefers-reduced-motion: reduce) {
        .fade { animation: none }
        .sweep, .pulse, .pulse2, .cursor, .rule { animation: none }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#room)"/>

    <!-- lit shutters, echoing the booth windows -->
    <g>
      <ellipse class="pulse"  cx="830" cy="150" rx="150" ry="118" fill="#e9a93c" opacity=".55" filter="url(#bloom)"/>
      <ellipse class="pulse2" cx="1045" cy="150" rx="140" ry="112" fill="#e9a93c" opacity=".55" filter="url(#bloom)"/>

      <g opacity=".92">
        <rect x="742" y="52" width="176" height="196" rx="3" fill="url(#amber)"/>
        <rect x="742" y="52" width="176" height="196" rx="3" fill="url(#mesh)"/>
        <rect x="742" y="52" width="176" height="196" rx="3" fill="none" stroke="#f6e2b4" stroke-opacity=".35"/>
      </g>
      <g opacity=".92">
        <rect x="958" y="52" width="176" height="196" rx="3" fill="url(#amber)"/>
        <rect x="958" y="52" width="176" height="196" rx="3" fill="url(#mesh)"/>
        <rect x="958" y="52" width="176" height="196" rx="3" fill="none" stroke="#f6e2b4" stroke-opacity=".35"/>
      </g>

      <!-- bottles on the sill -->
      <g fill="#07231d" opacity=".85" filter="url(#soft)">
        <rect x="772" y="196" width="9" height="52" rx="3"/><rect x="774" y="186" width="5" height="14"/>
        <rect x="792" y="204" width="9" height="44" rx="3"/><rect x="794" y="195" width="5" height="12"/>
        <rect x="1086" y="200" width="9" height="48" rx="3"/><rect x="1088" y="190" width="5" height="13"/>
      </g>
    </g>

    <!-- booth seat back -->
    <path d="M0 252 Q 360 236 740 248 L1200 240 L1200 300 L0 300 Z" fill="#071a16" opacity=".96"/>
    <path d="M0 252 Q 360 236 740 248" fill="none" stroke="#3f8a76" stroke-opacity=".22" stroke-width="1.5"/>

    <!-- type -->
    <g class="fade d1">
      <text x="72" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="78" font-weight="700" fill="#f2efe6" letter-spacing="2">Aarv</text>
    </g>
    <g class="fade d2">
      <text x="76" y="174" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif"
            font-size="21" fill="#8fc4b4" letter-spacing="3.4">DEVELOPER TOOLS · AI AUTOMATION</text>
    </g>
    <g class="fade d3">
      <text x="76" y="221" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18" fill="#e9a93c">
        <tspan fill="#4f8f7d">~$</tspan> currently building attentry<tspan class="cursor" dx="6">▊</tspan>
      </text>
    </g>
    <rect class="rule" x="76" y="240" width="300" height="2" fill="#e9a93c" opacity=".5"/>

    <!-- grade -->
    <rect width="1200" height="300" fill="url(#lines)"/>
    <rect class="sweep" x="0" y="0" width="1200" height="120" fill="url(#scan)"/>
    <rect width="1200" height="300" fill="url(#vig)"/>
    <rect width="1200" height="300" rx="10" fill="none" stroke="#2f6b5c" stroke-opacity=".3"/>
  </g>
</svg>
